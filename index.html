<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>猎鼠 · 猫咪游戏</title>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="猎鼠">
<meta name="theme-color" content="#050912">
<meta name="format-detection" content="telephone=no">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#050912;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  #stage{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    transform:translateX(-50%);z-index:5;pointer-events:none;
    font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    color:rgba(255,255,255,.42);letter-spacing:.04em;white-space:nowrap;text-align:center;
    transition:opacity 1.2s ease}
  #hint.off{opacity:0}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hint"></div>
<script>
(function(){
  'use strict';

  var cv = document.getElementById('stage');
  var ctx = cv.getContext('2d', {alpha:false});
  var hint = document.getElementById('hint');
  var W=0, H=0, DPR=1, bgGrad=null, S=1;
  var clock=0, last=0;
  var mouse=null;
  var particles=[];
  var audio=null, master=null, noiseBuf=null;
  var fsAttempts=0, wakeLock=null;

  // ---------- 尺寸 / 背景 ----------
  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W*DPR);
    cv.height = Math.round(H*DPR);
    cv.style.width = W+'px';
    cv.style.height = H+'px';
    S = Math.max(1.0, Math.min(1.9, Math.min(W,H)/480));
    bgGrad = ctx.createRadialGradient(W*0.5, H*0.45, 0, W*0.5, H*0.45, Math.max(W,H)*0.78);
    bgGrad.addColorStop(0, '#101a33');
    bgGrad.addColorStop(1, '#04060e');
  }

  // ---------- 声音：Web Audio 合成老鼠高频吱声 + 窸窣声（3–7 kHz，猫敏感频段） ----------
  function initAudio(){
    if(audio){ if(audio.state==='suspended') audio.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      audio = new AC();
      master = audio.createGain();
      master.gain.value = 0.17;
      master.connect(audio.destination);
      var len = Math.floor(audio.sampleRate*0.45);
      noiseBuf = audio.createBuffer(1, len, audio.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
      if(audio.state==='suspended') audio.resume();
      // iOS 首次手势内播放一帧静音，解锁音频通道
      var prime = audio.createBufferSource();
      prime.buffer = audio.createBuffer(1, 1, audio.sampleRate);
      prime.connect(audio.destination);
      prime.start(0);
    }catch(e){ audio=null; }
  }

  function chirp(vol, dur, f0, f1){
    if(!audio || audio.state!=='running') return;
    var t = audio.currentTime;
    var o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(200,f1), t + dur*0.45);
    o.frequency.exponentialRampToValueAtTime(Math.max(200,f0*0.72), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function squeak(){
    var f = 3400 + Math.random()*1900;
    chirp(0.45 + Math.random()*0.28, 0.09 + Math.random()*0.08, f, f*(1.45 + Math.random()*0.55));
    if(Math.random() < 0.55){
      var delay = 85 + Math.random()*75;
      setTimeout(function(){ chirp(0.26, 0.06, f*1.08, f*1.75); }, delay);
    }
  }

  function rustle(){
    if(!audio || audio.state!=='running' || !noiseBuf) return;
    var t = audio.currentTime;
    var src = audio.createBufferSource(), bp = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = noiseBuf;
    bp.type = 'bandpass';
    bp.frequency.value = 2800 + Math.random()*2800;
    bp.Q.value = 1.1;
    var dur = 0.12 + Math.random()*0.12;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.11, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }

  function deathSound(){
    chirp(0.5, 0.32, 5200, 900);
    setTimeout(function(){ chirp(0.24, 0.2, 3000, 1100); }, 70);
    rustle();
  }

  // ---------- 全屏 / 防误触 ----------
  function tryFullscreen(){
    if(fsAttempts >= 2) return;
    if(document.fullscreenElement || document.webkitFullscreenElement) return;
    fsAttempts++;
    var el = document.documentElement, p = null;
    try{
      if(el.requestFullscreen) p = el.requestFullscreen({navigationUI:'hide'});
      else if(el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
      if(p && p.catch) p.catch(function(){});
    }catch(e){
      try{ if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); }catch(e2){}
    }
  }

  function keepAwake(){
    try{
      if(navigator.wakeLock && !wakeLock){
        navigator.wakeLock.request('screen').then(function(l){
          wakeLock = l;
          l.addEventListener('release', function(){
            wakeLock = null;
            if(document.visibilityState === 'visible') keepAwake();
          });
        }).catch(function(){});
      }
    }catch(e){}
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      if(audio && audio.state === 'suspended') audio.resume();
      keepAwake();
    }
  });

  ['gesturestart','gesturechange','gestureend','dblclick','contextmenu','dragstart','selectstart']
    .forEach(function(n){ document.addEventListener(n, function(e){ e.preventDefault(); }, {passive:false}); });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  try{
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', function(){ history.pushState(null, '', location.href); });
  }catch(e){}

  // ---------- 老鼠 ----------
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function angleDiff(a,b){
    var d = a-b;
    while(d > Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    return d;
  }

  function pickTarget(m){
    var pad = 100*S;
    m.tx = pad + Math.random()*Math.max(1, W-2*pad);
    m.ty = pad + Math.random()*Math.max(1, H-2*pad);
    m.retarget = 0.7 + Math.random()*2.1;
  }

  function newSpeed(m){
    m.targetSpeed = 150 + Math.random()*250;          // px/s，慢走 → 快跑
    m.speedChange = 0.6 + Math.random()*1.8;
    var r = Math.random();
    if(r < 0.12){                                     // 突然冲刺
      m.targetSpeed *= 1.9;
      m.speedChange = 0.35 + Math.random()*0.5;
    } else if(r < 0.22){                              // 猎物式短暂停顿
      m.freeze = 0.25 + Math.random()*0.55;
    }
  }

  function spawn(fromEdge){
    var m = {
      s:S, x:0, y:0, heading:0, tx:0, ty:0,
      speed:240, targetSpeed:240,
      retarget:0, speedChange:0, freeze:0,
      soundTimer:0.25 + Math.random()*0.5,
      rustleTimer:0.5 + Math.random(),
      seed:Math.random()*100,
      alive:true, deadT:0, respawnAt:0, entering:!!fromEdge
    };
    if(fromEdge){
      var side = Math.floor(Math.random()*4), off = 78*S;
      var tx = W*(0.3 + Math.random()*0.4), ty = H*(0.3 + Math.random()*0.4);
      if(side === 0){ m.x = -off; m.y = H*Math.random(); }
      else if(side === 1){ m.x = W + off; m.y = H*Math.random(); }
      else if(side === 2){ m.x = W*Math.random(); m.y = -off; }
      else { m.x = W*Math.random(); m.y = H + off; }
      m.heading = Math.atan2(ty - m.y, tx - m.x);
      m.tx = tx; m.ty = ty; m.retarget = 1.1;
      m.speed = 420; m.targetSpeed = 420; m.speedChange = 0.9;
    }else{
      m.x = W*(0.35 + Math.random()*0.3);
      m.y = H*(0.35 + Math.random()*0.3);
      m.heading = Math.random()*Math.PI*2;
      newSpeed(m); pickTarget(m);
    }
    return m;
  }

  function updateMouse(dt, now){
    if(!mouse) mouse = spawn(false);
    if(!mouse.alive){
      mouse.deadT += dt;
      if(now >= mouse.respawnAt) mouse = spawn(true);
      return;
    }
    var m = mouse;
    m.retarget -= dt;
    m.speedChange -= dt;
    if(m.retarget <= 0) pickTarget(m);
    if(m.speedChange <= 0) newSpeed(m);

    var desired = Math.atan2(m.ty - m.y, m.tx - m.x);
    // 随机游走扰动：让轨迹不可预测
    desired += Math.sin(clock*2.3 + m.seed)*0.34
             + Math.sin(clock*5.7 + m.seed*2)*0.17
             + (Math.random()-0.5)*0.22;

    // 靠近边缘时转向屏幕中心
    var pad = 90*S;
    if(!m.entering && (m.x < pad || m.x > W-pad || m.y < pad || m.y > H-pad)){
      desired = Math.atan2(H*0.5 - m.y, W*0.5 - m.x) + (Math.random()-0.5)*0.7;
    }

    var turn = clamp(angleDiff(desired, m.heading), -2.8*dt, 2.8*dt);
    m.heading += turn;

    if(m.freeze > 0){
      m.freeze -= dt;
      m.speed += (0 - m.speed)*Math.min(1, dt*7);
    }else{
      m.speed += (m.targetSpeed - m.speed)*Math.min(1, dt*3.2);
    }
    m.x += Math.cos(m.heading)*m.speed*dt;
    m.y += Math.sin(m.heading)*m.speed*dt;

    if(m.entering){
      if(m.x > 40*S && m.x < W-40*S && m.y > 40*S && m.y < H-40*S) m.entering = false;
    }else{
      m.x = clamp(m.x, 24*S, W-24*S);
      m.y = clamp(m.y, 24*S, H-24*S);
    }

    // 只在跑动时发声
    if(m.speed > 75){
      m.soundTimer -= dt;
      m.rustleTimer -= dt;
      if(m.soundTimer <= 0){ squeak(); m.soundTimer = 0.38 + Math.random()*0.95; }
      if(m.rustleTimer <= 0){ rustle(); m.rustleTimer = 0.6 + Math.random()*1.5; }
    }
  }

  function drawMouse(m){
    var s = m.s;
    var fade = m.alive ? 1 : Math.max(0, 1 - m.deadT/0.42);
    if(fade <= 0) return;
    var run = m.speed > 75 ? 1 : 0.15;
    var bob = Math.sin(clock*15)*2.1*s*run;
    var leg = Math.sin(clock*19)*5*s*run;
    var tail = Math.sin(clock*9 + m.seed)*13*s;

    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(m.x, m.y + bob);
    ctx.rotate(m.heading + (m.alive ? 0 : m.deadT*3.2));
    ctx.shadowColor = 'rgba(238,255,60,.6)';
    ctx.shadowBlur = 26*s;

    // 尾巴（蓝色，猫同样敏感）
    ctx.beginPath();
    ctx.moveTo(-29*s, 0);
    ctx.quadraticCurveTo(-52*s, tail*0.5 + 12*s*Math.sin(clock*6 + m.seed), -78*s, tail);
    ctx.lineWidth = 5*s;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#7FD4FF';
    ctx.stroke();

    // 腿
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#DCEA52';
    ctx.lineWidth = 5*s;
    ctx.beginPath();
    ctx.moveTo(-12*s, 9*s); ctx.lineTo(-13*s + leg, 19*s);
    ctx.moveTo(8*s, 9*s);   ctx.lineTo(8*s - leg, 19*s);
    ctx.moveTo(-12*s, -9*s);ctx.lineTo(-13*s - leg, -17*s);
    ctx.moveTo(8*s, -9*s);  ctx.lineTo(8*s + leg, -17*s);
    ctx.stroke();

    // 身体 + 头（亮黄绿，猫二色视觉中最醒目的波长）
    ctx.shadowColor = 'rgba(238,255,60,.38)';
    ctx.shadowBlur = 18*s;
    ctx.fillStyle = '#F2FF38';
    ctx.beginPath(); ctx.ellipse(0, 0, 31*s, 16*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(24*s, 0, 14*s, 11*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // 圆耳朵（外黄内蓝，均为猫敏感色）
    ctx.fillStyle = '#EFFF35';
    ctx.beginPath(); ctx.arc(10*s, -17*s, 11*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10*s, 17*s, 11*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#35A9E0';
    ctx.beginPath(); ctx.arc(10*s, -17*s, 5*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10*s, 17*s, 5*s, 0, Math.PI*2); ctx.fill();

    // 眼睛、鼻子、胡须
    ctx.fillStyle = '#10182A';
    ctx.beginPath(); ctx.arc(29*s, -6.5*s, 3.2*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(29*s, 6.5*s, 3.2*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4FC8FF';
    ctx.beginPath(); ctx.arc(38*s, 0, 3.6*s, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 1.4*s;
    ctx.beginPath();
    ctx.moveTo(38*s, -2*s); ctx.lineTo(52*s, -11*s);
    ctx.moveTo(38*s, 0);    ctx.lineTo(55*s, 0);
    ctx.moveTo(38*s, 2*s);  ctx.lineTo(52*s, 11*s);
    ctx.stroke();
    ctx.restore();
  }

  // ---------- 捕获反馈 ----------
  function burst(x, y, s){
    for(var i=0;i<26;i++){
      var a = Math.random()*Math.PI*2, v = (90 + Math.random()*260)*s;
      particles.push({
        x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
        r:(2 + Math.random()*4)*s, life:0.55 + Math.random()*0.45, max:1,
        color: Math.random()<0.7 ? '#F2FF38' : '#7FD4FF'
      });
    }
  }

  function updateParticles(dt){
    for(var i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= dt;
      if(p.life <= 0) particles.splice(i,1);
    }
  }

  function drawParticles(){
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      ctx.globalAlpha = Math.min(1, p.life/0.5);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function kill(){
    if(!mouse || !mouse.alive) return;
    mouse.alive = false;
    mouse.deadT = 0;
    mouse.respawnAt = performance.now() + 720;
    burst(mouse.x, mouse.y, mouse.s);
    deathSound();
  }

  // ---------- 触摸命中（猫爪，容差半径大） ----------
  function hitTest(list){
    if(!mouse || !mouse.alive) return;
    var r = 50*mouse.s + 24;
    for(var i=0;i<list.length;i++){
      var p = list[i];
      if(!p) continue;
      var dx = p.clientX - mouse.x, dy = p.clientY - mouse.y;
      if(dx*dx + dy*dy <= r*r){ kill(); return; }
    }
  }

  function onStart(e){
    initAudio();
    tryFullscreen();
    keepAwake();
    hint.classList.add('off');
    hitTest(e.changedTouches && e.changedTouches.length ? e.changedTouches : [e]);
  }
  function onMove(e){
    hitTest(e.touches && e.touches.length ? e.touches : [e]);
  }
  document.addEventListener('touchstart', onStart, {passive:false});
  document.addEventListener('touchmove',  onMove,  {passive:false});
  document.addEventListener('mousedown',  onStart, {passive:false});
  document.addEventListener('click',      tryFullscreen, {passive:true});

  // ---------- 主循环 ----------
  function frame(now){
    var dt = Math.min(0.05, (now - last)/1000 || 0.016);
    last = now; clock += dt;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#050912';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    updateMouse(dt, now);
    updateParticles(dt);
    drawParticles();
    drawMouse(mouse);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });
  resize();

  var standalone = window.navigator.standalone === true ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  hint.textContent = standalone
    ? '轻触屏幕开启声音 · 把 iPad 自动锁定设为「永不」效果更佳'
    : '轻触屏幕开启声音与全屏 · 分享 → 添加到主屏幕可彻底隐藏浏览器栏';
  setTimeout(function(){ hint.classList.add('off'); }, 5000);
  setTimeout(function(){ if(hint.parentNode) hint.parentNode.removeChild(hint); }, 6500);

  // 立即开跑；声音在首次触摸后由系统解锁
  mouse = spawn(false);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
