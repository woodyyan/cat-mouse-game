<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>猎鼠 · 猫咪游戏</title>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="猎鼠">
<meta name="theme-color" content="#050912">
<meta name="format-detection" content="telephone=no">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#050912;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  #stage{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    transform:translateX(-50%);z-index:5;pointer-events:none;
    font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    color:rgba(255,255,255,.42);letter-spacing:.04em;white-space:nowrap;text-align:center;
    transition:opacity 1.2s ease}
  #hint.off{opacity:0}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hint"></div>
<script>
(function(){
  'use strict';

  var cv = document.getElementById('stage');
  var ctx = cv.getContext('2d', {alpha:false});
  var hint = document.getElementById('hint');
  var W=0, H=0, DPR=1, bgCanvas=null, S=1;
  var clock=0, last=0;
  var mouse=null;
  var particles=[];
  var fsAttempts=0, wakeLock=null;
  var soundReady=false, sfx={squeak:[],rustle:[],death:[]}, keepAlive=null;
  var hintTimer=null;
  // 预渲染精灵：渐变、阴影、复杂贝塞尔路径一次烘焙，运行时每帧只 drawImage
  var SPRITE_N=16, SPRITE_FPS=20;
  var sprites=[], sprW=0, sprH=0, sprCx=0, sprCy=0;

  // ---------- 尺寸 / 背景 ----------
  function buildBackground(){
    bgCanvas = document.createElement('canvas');
    bgCanvas.width  = Math.max(1, Math.round(W));   // 渐变平滑，DPR=1 足够
    bgCanvas.height = Math.max(1, Math.round(H));
    var g = bgCanvas.getContext('2d');
    var grad = g.createRadialGradient(W*0.5, H*0.45, 0, W*0.5, H*0.45, Math.max(W,H)*0.78);
    grad.addColorStop(0, '#101a33');
    grad.addColorStop(1, '#04060e');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
  }

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W*DPR);
    cv.height = Math.round(H*DPR);
    cv.style.width = W+'px';
    cv.style.height = H+'px';
    S = Math.max(1.0, Math.min(1.9, Math.min(W,H)/480));
    if(mouse) mouse.s = S;
    buildBackground();
    buildSprites();
  }

  // ---------- 声音：预合成 WAV + HTMLAudioElement ----------
  // iPadOS Safari 默认把 Web Audio 归为 ambient 音频会话，静音开关会直接掐掉输出；
  // HTML5 <audio> 属于 playback 会话，不受静音开关影响，因此改用 <audio> 发声。
  var SR = 44100;

  function wavURI(samples){
    var n = samples.length, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
    function put(off, s){ for(var k=0;k<s.length;k++) v.setUint8(off+k, s.charCodeAt(k)); }
    put(0,'RIFF');  v.setUint32(4, 36+n*2, true); put(8,'WAVE');
    put(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,SR,true); v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    put(36,'data'); v.setUint32(40,n*2,true);
    for(var i=0;i<n;i++){
      var q = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44+i*2, q<0 ? q*0x8000 : q*0x7FFF, true);
    }
    var bytes = new Uint8Array(buf), bin = '', step = 0x8000;
    for(var j=0;j<bytes.length;j+=step){
      bin += String.fromCharCode.apply(null, bytes.subarray(j, j+step));
    }
    return 'data:audio/wav;base64,' + btoa(bin);
  }

  // 吱声：2.2–5.6 kHz 扫频 + 8–17 kHz 谐波（猫敏感）+ 低频共振（iPad 扬声器/人耳可听）
  function makeSqueak(f0, dur){
    var n = Math.floor(SR*dur), out = new Float32Array(n), ph = 0, low = 0;
    for(var i=0;i<n;i++){
      var u = i/n, t = i/SR;
      var f = f0*(1 + 0.55*Math.sin(Math.PI*u) - 0.3*u);
      ph  += 2*Math.PI*f/SR;
      low += 2*Math.PI*(f*0.42)/SR;
      var env = Math.min(1, t/0.006)*Math.pow(1-u, 1.25);
      var trem = 0.86 + 0.14*Math.sin(2*Math.PI*38*t);
      out[i] = 0.85*env*trem*(0.55*Math.sin(ph) + 0.2*Math.sin(2*ph) +
                              0.08*Math.sin(3*ph) + 0.18*Math.sin(low));
    }
    return wavURI(out);
  }

  function makeRustle(){
    var dur = 0.2, n = Math.floor(SR*dur), out = new Float32Array(n), lp = 0;
    for(var i=0;i<n;i++){
      var u = i/n, t = i/SR;
      lp += ((Math.random()*2-1) - lp)*0.22;
      var env = Math.min(1, t/0.01)*Math.pow(1-u,1.5)*(0.8+0.2*Math.sin(2*Math.PI*25*t));
      out[i] = env*lp*0.9;
    }
    return wavURI(out);
  }

  function makeDeath(){
    var dur = 0.42, n = Math.floor(SR*dur), out = new Float32Array(n), ph = 0;
    for(var i=0;i<n;i++){
      var u = i/n, t = i/SR;
      ph += 2*Math.PI*(4200*Math.pow(0.22,u))/SR;
      var env = Math.min(1, t/0.008)*Math.pow(1-u,0.8)*(0.85+0.15*Math.sin(2*Math.PI*30*t));
      out[i] = env*(0.55*Math.sin(ph) + 0.2*Math.sin(2*ph) + 0.12*(Math.random()*2-1));
    }
    return wavURI(out);
  }

  function makeSilence(){
    return wavURI(new Float32Array(Math.floor(SR*0.5)));
  }

  function mkAudio(uri, vol, loop){
    var a = document.createElement('audio');
    a.src = uri;
    a.preload = 'auto';
    a.volume = vol;
    a.loop = !!loop;
    a.setAttribute('playsinline','');
    a.setAttribute('webkit-playsinline','');
    a.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(a);
    return a;
  }

  // Safari 17+：直接声明 playback 会话，静音模式下也能出声
  function setPlaybackSession(){
    try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
  }

  function buildSounds(){
    sfx.squeak = [
      mkAudio(makeSqueak(2200, 0.13),  0.85),
      mkAudio(makeSqueak(2900, 0.11),  0.85),
      mkAudio(makeSqueak(3600, 0.095), 0.85)
    ];
    sfx.rustle = [mkAudio(makeRustle(), 0.7)];
    sfx.death  = [mkAudio(makeDeath(), 0.9)];
    keepAlive  = mkAudio(makeSilence(), 1, true);
    setPlaybackSession();
  }

  function showAudioHint(ok){
    if(!hint || !hint.parentNode) return;
    hint.textContent = ok ? '声音已开启' : '声音被拦截 · 再轻触一次屏幕';
    hint.classList.remove('off');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){ hint.classList.add('off'); }, 1800);
  }

  // iOS 要求：解锁必须发生在用户手势的同步调用栈内，不能在任何异步之后
  function unlockAudio(){
    if(soundReady) return;
    soundReady = true;
    setPlaybackSession();
    var all = sfx.squeak.concat(sfx.rustle, sfx.death, [keepAlive]);
    for(var i=0;i<all.length;i++){
      try{
        var p = all[i].play();
        if(p && p.catch) p.catch(function(){});
        all[i].pause();
        all[i].currentTime = 0;
      }catch(e){}
    }
    // 静音 loop 持续把会话保持在 playback 类别（兼容 iOS 16 及以下）
    try{ var q = keepAlive.play(); if(q && q.catch) q.catch(function(){}); }catch(e){}
    setTimeout(function(){ playSfx('squeak'); }, 130);
    showAudioHint(true);
  }

  function playSfx(kind){
    if(!soundReady) return;
    var arr = sfx[kind];
    if(!arr || !arr.length) return;
    var a = arr.length > 1 ? arr[Math.floor(Math.random()*arr.length)] : arr[0];
    try{
      a.pause();
      a.currentTime = 0;
      var p = a.play();
      if(p && p.catch) p.catch(function(){
        soundReady = false;                 // 会话被系统中断，下次触摸重新解锁
        showAudioHint(false);
      });
    }catch(e){}
  }

  // 全屏切换 / 回到前台后重新激活音频会话
  function reactivateAudio(){
    if(!soundReady) return;
    setPlaybackSession();
    try{ var p = keepAlive.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
  }

  function squeak(){ playSfx('squeak'); }
  function rustle(){ playSfx('rustle'); }
  function deathSound(){
    playSfx('death');
    setTimeout(function(){ playSfx('squeak'); }, 110);
  }

  // ---------- 全屏 / 防误触 ----------
  function tryFullscreen(){
    if(fsAttempts >= 2) return;
    if(document.fullscreenElement || document.webkitFullscreenElement) return;
    fsAttempts++;
    var el = document.documentElement, p = null;
    try{
      if(el.requestFullscreen) p = el.requestFullscreen({navigationUI:'hide'});
      else if(el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
      if(p && p.catch) p.catch(function(){});
    }catch(e){
      try{ if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); }catch(e2){}
    }
  }

  function keepAwake(){
    try{
      if(navigator.wakeLock && !wakeLock){
        navigator.wakeLock.request('screen').then(function(l){
          wakeLock = l;
          l.addEventListener('release', function(){
            wakeLock = null;
            if(document.visibilityState === 'visible') keepAwake();
          });
        }).catch(function(){});
      }
    }catch(e){}
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      reactivateAudio();
      keepAwake();
    }
  });
  // 全屏切换会重建音频会话，切换完成后重新激活
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(n){
    document.addEventListener(n, function(){ setTimeout(reactivateAudio, 200); });
  });
  window.addEventListener('pageshow', function(){ setTimeout(reactivateAudio, 200); });

  ['gesturestart','gesturechange','gestureend','dblclick','contextmenu','dragstart','selectstart']
    .forEach(function(n){ document.addEventListener(n, function(e){ e.preventDefault(); }, {passive:false}); });
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
  try{
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', function(){ history.pushState(null, '', location.href); });
  }catch(e){}

  // ---------- 老鼠 ----------
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
  function angleDiff(a,b){
    var d = a-b;
    while(d > Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    return d;
  }

  // 目标点可落在屏幕外，逼老鼠冲到边缘；小概率直接反向折返
  function pickTarget(m){
    var pad = 34*S;
    m.tx = -pad + Math.random()*(W + 2*pad);
    m.ty = -pad + Math.random()*(H + 2*pad);
    if(Math.random() < 0.18){
      m.tx = m.x - (m.tx - m.x)*0.85;
      m.ty = m.y - (m.ty - m.y)*0.85;
    }
    m.retarget = 0.35 + Math.random()*1.25;
  }

  function bounceTarget(m){
    m.tx = W*(0.12 + Math.random()*0.76);
    m.ty = H*(0.12 + Math.random()*0.76);
    m.retarget = 0.45 + Math.random()*0.9;
  }

  // 五档速度：潜伏 / 常速 / 爆发冲刺 / 急停急转，换档间隔 0.28–1.3s
  function newSpeed(m){
    var r = Math.random();
    m.lockedTurn = 0;
    if(r < 0.14){                                   // 潜伏慢走 70–180 px/s
      m.targetSpeed = 70 + Math.random()*110;
      m.speedChange = 0.3 + Math.random()*0.65;
    }else if(r < 0.34){                             // 爆发冲刺 780–1200 px/s，近直线
      m.targetSpeed = 780 + Math.random()*420;
      m.speedChange = 0.28 + Math.random()*0.5;
      m.lockedTurn = m.speedChange*0.85;
    }else if(r < 0.45){                             // 急停 + 停后大幅度变向
      m.freeze = 0.15 + Math.random()*0.4;
      m.pendingTurn = (Math.random()<0.5 ? -1 : 1)*(1.1 + Math.random()*1.6);
      m.targetSpeed = 100 + Math.random()*140;
      m.speedChange = m.freeze + 0.05;
    }else{                                          // 常规变奏 260–640 px/s
      m.targetSpeed = 260 + Math.random()*380;
      m.speedChange = 0.3 + Math.random()*1.0;
    }
  }

  function spawn(fromEdge){
    var m = {
      s:S, x:0, y:0, heading:0, tx:0, ty:0,
      speed:240, targetSpeed:240,
      retarget:0, speedChange:0, freeze:0,
      lockedTurn:0, pendingTurn:0,
      animPhase:Math.random()*SPRITE_N,
      soundTimer:0.25 + Math.random()*0.5,
      rustleTimer:0.5 + Math.random(),
      seed:Math.random()*100,
      alive:true, deadT:0, respawnAt:0, entering:!!fromEdge
    };
    if(fromEdge){
      var side = Math.floor(Math.random()*4), off = 78*S;
      var tx = W*(0.3 + Math.random()*0.4), ty = H*(0.3 + Math.random()*0.4);
      if(side === 0){ m.x = -off; m.y = H*Math.random(); }
      else if(side === 1){ m.x = W + off; m.y = H*Math.random(); }
      else if(side === 2){ m.x = W*Math.random(); m.y = -off; }
      else { m.x = W*Math.random(); m.y = H + off; }
      m.heading = Math.atan2(ty - m.y, tx - m.x);
      m.tx = tx; m.ty = ty; m.retarget = 1.1;
      m.speed = 650 + Math.random()*250;
      m.targetSpeed = m.speed; m.speedChange = 0.9;
    }else{
      m.x = W*(0.35 + Math.random()*0.3);
      m.y = H*(0.35 + Math.random()*0.3);
      m.heading = Math.random()*Math.PI*2;
      newSpeed(m); pickTarget(m);
    }
    return m;
  }

  function updateMouse(dt, now){
    if(!mouse) mouse = spawn(false);
    if(!mouse.alive){
      mouse.deadT += dt;
      if(now >= mouse.respawnAt) mouse = spawn(true);
      return;
    }
    var m = mouse;
    m.retarget -= dt;
    m.speedChange -= dt;
    m.lockedTurn -= dt;
    if(m.retarget <= 0) pickTarget(m);
    if(m.speedChange <= 0) newSpeed(m);

    // 多频平滑扰动：轨迹难预测，但不会逐帧抖动
    var desired = Math.atan2(m.ty - m.y, m.tx - m.x)
                + Math.sin(clock*2.3 + m.seed)*0.42
                + Math.sin(clock*6.1 + m.seed*2)*0.22
                + Math.sin(clock*11.3 + m.seed*3)*0.09;
    var turnRate = m.lockedTurn > 0 ? 1.3 : 3.6 + 1.6*Math.sin(clock*1.7 + m.seed);
    m.heading += clamp(angleDiff(desired, m.heading), -turnRate*dt, turnRate*dt);

    if(m.freeze > 0){
      m.freeze -= dt;
      m.speed += (0 - m.speed)*Math.min(1, dt*12);
      if(m.freeze <= 0 && m.pendingTurn){
        m.heading += m.pendingTurn;
        m.pendingTurn = 0;
        pickTarget(m);
      }
    }else{
      var accel = m.targetSpeed > m.speed ? 10 : 8;   // 快起快停，忽快忽慢
      m.speed += (m.targetSpeed - m.speed)*Math.min(1, dt*accel);
    }
    m.x += Math.cos(m.heading)*m.speed*dt;
    m.y += Math.sin(m.heading)*m.speed*dt;

    if(m.entering){
      if(m.x > 40*S && m.x < W-40*S && m.y > 40*S && m.y < H-40*S) m.entering = false;
    }else{
      // 真正跑到边缘再镜面反弹折返，而不是提前被拉回中心
      var e = 10*S, jitter = (Math.random()-0.5)*0.9, hit = false;
      if(m.x < e){ m.x = e; m.heading = Math.PI - m.heading + jitter; hit = true; }
      else if(m.x > W-e){ m.x = W-e; m.heading = Math.PI - m.heading + jitter; hit = true; }
      if(m.y < e){ m.y = e; m.heading = -m.heading + jitter; hit = true; }
      else if(m.y > H-e){ m.y = H-e; m.heading = -m.heading + jitter; hit = true; }
      if(hit) bounceTarget(m);
    }

    // 步态播放速率跟随速度：慢走慢摆、冲刺快摆
    m.animPhase += dt*SPRITE_FPS*(0.5 + Math.min(1.4, m.speed/430));

    // 只在跑动时发声
    if(m.speed > 75){
      m.soundTimer -= dt;
      m.rustleTimer -= dt;
      if(m.soundTimer <= 0){ squeak(); m.soundTimer = 0.3 + Math.random()*0.85; }
      if(m.rustleTimer <= 0){ rustle(); m.rustleTimer = 0.55 + Math.random()*1.3; }
    }
  }

  // ---------- 预渲染精灵 ----------
  // 把渐变、shadowBlur 发光、贝塞尔轮廓等重活一次性烘焙成 16 帧动画，
  // 运行时每帧只做 1 次背景 drawImage + 1 次老鼠 drawImage。
  function renderMouseSprite(g, s, p){
    var TAU = Math.PI*2;
    var bob = Math.sin(p*3)*2*s;
    var stretch = 1 + Math.sin(p*3 + 1)*0.028;
    var earFlap = Math.sin(p*5)*1.2*s;

    g.save();
    g.translate(0, bob);

    var halo = g.createRadialGradient(0, 0, 0, 0, 0, 52*s);
    halo.addColorStop(0, 'rgba(240,255,80,.16)');
    halo.addColorStop(1, 'rgba(240,255,80,0)');
    g.fillStyle = halo;
    g.beginPath(); g.arc(0, 0, 52*s, 0, TAU); g.fill();

    g.scale(stretch, 1 + (1-stretch)*0.5);

    // 尾巴：锥形蓝色，波动沿长度传播
    var N = 11, pts = [];
    for(var i=0;i<=N;i++){
      var u = i/N;
      var sway = Math.sin(p - u*3.4)*(3 + 15*u)*s + Math.sin(u*2.6)*3*s*u;
      pts.push([-30*s - u*56*s, sway]);
    }
    g.lineCap = 'round';
    for(var i=0;i<N;i++){
      var u = i/N;
      g.beginPath();
      g.moveTo(pts[i][0], pts[i][1]);
      g.lineTo(pts[i+1][0], pts[i+1][1]);
      g.lineWidth = (4.6 - 3.5*u)*s;
      g.strokeStyle = 'rgb(' + Math.round(169-90*u) + ',' + Math.round(230-72*u) +
                      ',' + Math.round(255-36*u) + ')';
      g.stroke();
    }
    g.strokeStyle = 'rgba(255,255,255,.34)';
    g.lineWidth = 0.9*s;
    g.beginPath();
    for(var i=0;i<7;i++){
      if(i === 0) g.moveTo(pts[i][0], pts[i][1] - 1*s);
      else g.lineTo(pts[i][0], pts[i][1] - 1*s);
    }
    g.stroke();

    // 四足交替步态 + 脚掌爪尖
    function drawLeg(px, py, phase){
      var swing = Math.sin(p*3 + phase)*5.5*s;
      var fx = px + swing, fy = py + Math.abs(swing)*0.12;
      g.strokeStyle = 'rgba(148,168,18,.9)';
      g.lineWidth = 2.8*s;
      g.beginPath(); g.moveTo(px, py*0.45); g.lineTo(fx, fy); g.stroke();
      g.fillStyle = '#EAF63F';
      g.beginPath(); g.ellipse(fx + 1.2*s, fy, 4*s, 2.2*s, 0, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.45)';
      g.lineWidth = 0.8*s;
      g.beginPath();
      g.moveTo(fx+4*s, fy-0.8*s); g.lineTo(fx+6*s,   fy-1.3*s);
      g.moveTo(fx+4*s, fy);       g.lineTo(fx+6.4*s, fy);
      g.moveTo(fx+4*s, fy+0.8*s); g.lineTo(fx+6*s,   fy+1.3*s);
      g.stroke();
    }
    drawLeg(-17*s, -18.5*s, 0);
    drawLeg(-17*s,  18.5*s, Math.PI);
    drawLeg( 13*s, -17.5*s, Math.PI);
    drawLeg( 13*s,  17.5*s, 0);

    // 一体化纺锤形身体
    g.beginPath();
    g.moveTo(-31*s, 0);
    g.bezierCurveTo(-30*s, -13*s, -10*s, -19*s, 10*s, -16*s);
    g.bezierCurveTo( 22*s, -14*s,  31*s, -10*s, 41*s, -4.5*s);
    g.quadraticCurveTo(49*s, 0, 41*s, 4.5*s);
    g.bezierCurveTo( 31*s,  10*s,  22*s,  14*s, 10*s,  16*s);
    g.bezierCurveTo(-10*s,  19*s, -30*s,  13*s,-31*s, 0);
    g.closePath();
    var fur = g.createLinearGradient(0, -18*s, 0, 18*s);
    fur.addColorStop(0, '#FBFF86'); fur.addColorStop(0.38, '#F4FF45');
    fur.addColorStop(0.72, '#E2EF2C'); fur.addColorStop(1, '#B9CE1C');
    g.shadowColor = 'rgba(240,255,70,.5)';
    g.shadowBlur = 20*s;
    g.fillStyle = fur;
    g.fill();
    g.shadowBlur = 0;
    g.strokeStyle = 'rgba(105,125,10,.55)';
    g.lineWidth = 1.4*s;
    g.stroke();   // 路径仍是身体，描边须紧接 fill

    // 脸部浅色区与背部高光
    g.fillStyle = 'rgba(255,255,255,.10)';
    g.beginPath(); g.ellipse(30*s, 0, 15*s, 8.5*s, 0, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.26)';
    g.lineWidth = 2.3*s;
    g.beginPath();
    g.moveTo(-22*s, -5*s);
    g.bezierCurveTo(-8*s, -12*s, 10*s, -12*s, 27*s, -7*s);
    g.stroke();

    // 半露圆耳
    function drawEar(sign){
      g.save();
      g.translate(8*s, sign*13*s + earFlap*sign);
      g.rotate(sign*0.16);
      g.scale(1, sign);
      var R = 9*s, r = 5.4*s;
      var eg = g.createRadialGradient(-2*s, 2*s, 0.5*s, 0, 0, R);
      eg.addColorStop(0, '#FFFBA6'); eg.addColorStop(1, '#DCE92A');
      g.fillStyle = eg;
      g.beginPath(); g.moveTo(R, 0); g.arc(0, 0, R, 0, Math.PI, false); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(110,130,10,.45)';
      g.lineWidth = 1.1*s;
      g.stroke();
      var ig = g.createRadialGradient(-1*s, 1*s, 0.4*s, 0, 0, r);
      ig.addColorStop(0, '#A7E9FF'); ig.addColorStop(1, '#2B8FCB');
      g.fillStyle = ig;
      g.beginPath(); g.moveTo(r, 0); g.arc(0, 0, r, 0, Math.PI, false); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.3)';
      g.lineWidth = 0.8*s;
      g.beginPath();
      g.moveTo(-2.5*s, 1.2*s);
      g.quadraticCurveTo(0, 3.2*s, 2.5*s, 1.4*s);
      g.stroke();
      g.restore();
    }
    drawEar(-1); drawEar(1);

    // 眼睛、鼻尖、胡须
    function drawEye(sign){
      var ex = 31*s, ey = sign*7*s;
      g.fillStyle = '#0E1626';
      g.beginPath(); g.ellipse(ex, ey, 3.5*s, 4*s, 0, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,.92)';
      g.beginPath(); g.arc(ex-1.1*s, ey-1.4*s, 1.25*s, 0, TAU); g.fill();
      g.fillStyle = 'rgba(110,210,255,.85)';
      g.beginPath(); g.arc(ex+1.2*s, ey+1.3*s, 0.8*s, 0, TAU); g.fill();
    }
    drawEye(-1); drawEye(1);
    g.fillStyle = '#3FB6F0';
    g.beginPath(); g.ellipse(48*s, 0, 3.4*s, 2.6*s, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,.8)';
    g.beginPath(); g.arc(47*s, -0.9*s, 1*s, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.38)';
    g.lineWidth = 0.9*s;
    for(var q=-1;q<=1;q+=2){
      for(var k=0;k<3;k++){
        var y0 = q*(1.2 + k*1.2)*s, y1 = q*(4 + k*3.2)*s;
        g.beginPath();
        g.moveTo(44*s, y0);
        g.quadraticCurveTo(50*s, y0 + q*0.6*s, 54*s + k*1.5*s, y1);
        g.stroke();
      }
    }
    g.restore();
  }

  function buildSprites(){
    var s = S;
    sprCx = 116*s; sprCy = 56*s;           // 覆盖尾巴 -86*s 与柔光/发光边界
    sprW = sprCx + 90*s; sprH = 2*sprCy;
    for(var i=0;i<sprites.length;i++){ sprites[i].width = 0; sprites[i].height = 0; }
    sprites = [];
    for(var f=0;f<SPRITE_N;f++){
      var c = document.createElement('canvas');
      c.width = Math.ceil(sprW*DPR);
      c.height = Math.ceil(sprH*DPR);
      var g = c.getContext('2d');
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      g.translate(sprCx, sprCy);
      renderMouseSprite(g, s, Math.PI*2*f/SPRITE_N);
      sprites.push(c);
    }
  }

  function drawMouse(m){
    if(!m || !sprites.length) return;
    var fade = m.alive ? 1 : Math.max(0, 1 - m.deadT/0.42);
    if(fade <= 0) return;
    var img = sprites[Math.floor(m.animPhase) % SPRITE_N];
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(m.x, m.y);
    ctx.rotate(m.heading + (m.alive ? 0 : m.deadT*3.2));
    var ds = m.alive ? 1 : Math.max(0.6, 1 - m.deadT*0.75);
    ctx.scale(ds, ds);
    ctx.drawImage(img, -sprCx, -sprCy, sprW, sprH);
    ctx.restore();
  }

  // ---------- 捕获反馈 ----------
  function burst(x, y, s){
    for(var i=0;i<26;i++){
      var a = Math.random()*Math.PI*2, v = (90 + Math.random()*260)*s;
      particles.push({
        x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
        r:(2 + Math.random()*4)*s, life:0.55 + Math.random()*0.45, max:1,
        color: Math.random()<0.7 ? '#F2FF38' : '#7FD4FF'
      });
    }
  }

  function updateParticles(dt){
    for(var i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= dt;
      if(p.life <= 0) particles.splice(i,1);
    }
  }

  function drawParticles(){
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      ctx.globalAlpha = Math.min(1, p.life/0.5);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function kill(){
    if(!mouse || !mouse.alive) return;
    mouse.alive = false;
    mouse.deadT = 0;
    mouse.respawnAt = performance.now() + 720;
    burst(mouse.x, mouse.y, mouse.s);
    deathSound();
  }

  // ---------- 触摸命中（猫爪，容差半径大） ----------
  function hitTest(list){
    if(!mouse || !mouse.alive) return;
    var r = 56*mouse.s + 28;   // 速度提高后适当放宽命中容差
    for(var i=0;i<list.length;i++){
      var p = list[i];
      if(!p) continue;
      var dx = p.clientX - mouse.x, dy = p.clientY - mouse.y;
      if(dx*dx + dy*dy <= r*r){ kill(); return; }
    }
  }

  function onStart(e){
    unlockAudio();
    tryFullscreen();
    keepAwake();
    hitTest(e.changedTouches && e.changedTouches.length ? e.changedTouches : [e]);
  }
  function onMove(e){
    if(!soundReady) unlockAudio();
    hitTest(e.touches && e.touches.length ? e.touches : [e]);
  }
  document.addEventListener('touchstart', onStart, {passive:false});
  document.addEventListener('touchmove',  onMove,  {passive:false});
  document.addEventListener('mousedown',  onStart, {passive:false});
  document.addEventListener('click', function(){ unlockAudio(); tryFullscreen(); }, {passive:true});

  // ---------- 主循环 ----------
  function frame(now){
    var dt = Math.min(0.05, (now - last)/1000 || 0.016);
    last = now; clock += dt;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(bgCanvas, 0, 0, W, H);   // 预渲染背景，一次纹理拷贝
    updateMouse(dt, now);
    updateParticles(dt);
    drawParticles();
    drawMouse(mouse);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });
  resize();

  var standalone = window.navigator.standalone === true ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  hint.textContent = standalone
    ? '轻触屏幕开启声音 · 把 iPad 自动锁定设为「永不」效果更佳'
    : '轻触屏幕开启声音与全屏 · 分享 → 添加到主屏幕可彻底隐藏浏览器栏';
  setTimeout(function(){ if(!hintTimer) hint.classList.add('off'); }, 5000);
  // hint 常驻 DOM（仅淡出），用于首次触摸后回显音频状态

  buildSounds();                  // 预合成全部音效并挂载 <audio> 元素
  mouse = spawn(false);
  requestAnimationFrame(frame);   // 立即开跑；声音在首次触摸后解锁
})();
</script>
</body>
</html>
